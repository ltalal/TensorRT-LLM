backend: pytorch
max_seq_len: 200000
max_num_tokens: 8192
trust_remote_code: true
tensor_parallel_size: 8
moe_expert_parallel_size: 1
kv_cache_config:
  enable_block_reuse: true
  free_gpu_memory_fraction: 0.85
  host_cache_size: 68719476736 # 64GB
  # host_cache_size: 137438953472 # 128GB
  # host_cache_size: 171798691840 # 160GB
speculative_config:
  decoding_type: MTP
  num_nextn_predict_layers: 2
  allow_advanced_sampling: true
  use_relaxed_acceptance_for_thinking: true
  relaxed_topk: 4
  relaxed_delta: 0.4
cuda_graph_config:
  max_batch_size: 8
  enable_padding: true
moe_config:
  backend: TRTLLM
enable_chunked_prefill: true
stream_interval: 4
allreduce_strategy: NCCL
enable_iter_perf_stats: true
enable_iter_req_stats: true
print_iter_log: true
return_perf_metrics: true